
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitações de serviço</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  
</head>
<body>

  <header class="topo">
    <h1>Solicitações de serviço</h1>
    <p>Registre, acompanhe e conclua pedidos por bairro.</p>
  </header>

  <main class="conteudo">

    <section class="painel" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Nova solicitação</h2>

      <form id="form-nova"
            th:action="@{/solicitacoes}"
            method="post">

        <div class="campo">
          <label for="select_categoria">Categoria</label>

          <select id="select_categoria" name="categoria" required>
            <option value="">Selecione</option>
            <option value="Iluminação">Iluminação</option>
            <option value="Limpeza urbana">Limpeza urbana</option>
            <option value="Buraco na via">Buraco na via</option>
            <option value="Água e esgoto">Água e esgoto</option>
            <option value="Outros">Outros</option>
          </select>
        </div>

        <div class="campo">
          <label for="txt_bairro">Bairro</label>
          <input id="txt_bairro"
                 name="bairro"
                 type="text"
                 required>
        </div>

        <div class="campo">
          <label for="txt_descricao">Descrição</label>
          <textarea id="txt_descricao"
                    name="descricao"
                    rows="3"
                    required></textarea>
        </div>

        <div class="campo campo-curto">
          <label for="input_prioridade">Prioridade (1 a 5)</label>
          <input id="input_prioridade"
                 name="prioridade"
                 type="number"
                 min="1"
                 max="5"
                 step="1"
                 required>
        </div>

        <p id="erro-nova" class="erro" role="alert" hidden></p>

        <button id="btn_cadastrar"
                type="submit"
                class="botao">
          Cadastrar solicitação
        </button>

      </form>
    </section>

    <section class="painel" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">Solicitações</h2>

      <p id="vazio" class="vazio">
        Nenhuma solicitação cadastrada.
        Preencha o formulário para criar a primeira.
      </p>
    </section>

  </main>
</body>
</html>
