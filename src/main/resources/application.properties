spring.application.name=cidade-atende-mini

# Configuração do banco H2
spring.datasource.url=jdbc:h2:file:./data/cidade_atende
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Bootstrap opcional do primeiro administrador; a senha nunca é definida no código.
app.admin.email=${ADMIN_EMAIL:admin@urbanapp.local}
app.admin.password=${ADMIN_PASSWORD:}